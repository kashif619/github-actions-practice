#  What is the Goal of your workflow
# Goal Whenever someone changes the python code
#  The Linter will check the syntax, format, indentation (Linting) is correct or not
name: Auto Linter

on: 
  push: 
    paths: "*.py"

jobs:
  code:  
    runs-on: ubuntu-latest
    steps:
    # this step will automatically clone the code from the current branch into the runner
      - name: checkout/Clone the code
        uses: actions/checkout@v7
    # this step will install the linteing tool
      - name: Install Linter
        run: pip install ruff
        
  
